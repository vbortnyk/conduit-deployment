name: Deploy

on:  
  push:
    branches:
      - main
      - ci/cd-setup-with-env
    paths:
      - '.github/workflows/deployment.yml'
      - 'compose.yml'

  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout orchesrator
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/conduit-frontend
          token: ${{ secrets.GIT_TOKEN }}
          path: conduit-frontend

      - name: Checkout backend
        uses: actions/checkout@v4
        with: 
          repository: ${{ github.repository_owner }}/conduit-backend
          token: ${{ secrets.GIT_TOKEN }}
          path: conduit-backend

      - name: Login to GHCR
        uses: docker/login-action@v4
        with: 
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GIT_TOKEN }}

      - name: Load .env
        run: |
           scp -i ssh_key \
             ${{ vars.VPS_USERNAME }}@${{ vars.VPS_HOST }}:~/projects/conduit-deployment/.env \
             .
            
      - name: login to VPS
        uses: appleboy/ssh-action@v1.2.0  
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }} 
          script: |
            scp projects/conduit-deployment/.env .

            echo "${{ secrets.GIT_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.repository_owner }}" \
              --password-stdin

      - name: Build and push all to GHCR              
        run: |
          docker compose build
          docker compose push
          
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0  
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }} 

          script: |    
            echo "${{ secrets.GIT_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.repository_owner }}" \
              --password-stdin
  
            cd projects/conduit-deployment
            
            docker compose pull
            docker compose up -d --force-recreate