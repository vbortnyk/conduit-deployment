name: Deployment

on: 
  workflow_call:
    
    inputs:
      tag:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0  
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }} 

          script: |    
            echo "${{ secrets.GIT_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.repository_owner }}" \
              --password-stdin
  
            cd projects/conduit-deployment
            
            export REPOSITORY_OWNER=${{ github.repository_owner }}
            export TAG=${{ inputs.tag }}

            docker compose pull
            docker compose up -d --force-recreate
