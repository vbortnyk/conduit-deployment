name: Service deployment

# These environmend variables should be configured on an organisation level with corresponding scopes.
# They are hardcodecd here for testing purposes.
env:
  FRONTEND_PORT: 8282
  BACKEND_PORT: 8000
  FRONTEND_SERVICE_NAME: conduit-frontend
  BACKEND_SERVICE_NAME: conduit-backend

on: 
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

      service:
        required: true
        type: string

      port:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io \
              -u "${{ github.repository_owner }}" \
              --password-stdin

            cd projects/conduit-deployment

            export TAG=${{ inputs.tag }}
            export REPOSITORY_OWNER=${{ github.repository_owner }}
            case "${{ inputs.service }}" in
              "${{ env.FRONTEND_SERVICE_NAME }}") export FRONTEND_PORT=${{ env.FRONTEND_PORT }} ;;
              "${{ env.BACKEND_SERVICE_NAME }}") export BACKEND_PORT="${{ env.BACKEND_PORT }}" ;;
            esac

            docker compose pull ${{ inputs.service }}
            docker compose up -d --no-deps --force-recreate ${{ inputs.service }}
